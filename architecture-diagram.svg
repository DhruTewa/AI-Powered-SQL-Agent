<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Courier New', monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1714"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8442c"/>
    </marker>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#d9d2c2" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="340" fill="#fbf9f3"/>
  <rect width="900" height="340" fill="url(#grid)"/>

  <!-- Title -->
  <text x="450" y="22" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="16" fill="#1a1714" font-weight="500" font-style="italic">SQL AI Agent — Architecture Overview</text>

  <!-- Top row: LLM API and Database -->
  <g>
    <rect x="350" y="50" width="120" height="60" rx="4" fill="#b8442c" stroke="#1a1714" stroke-width="1"/>
    <text x="410" y="78" text-anchor="middle" font-size="11" fill="#fbf9f3" font-weight="700">LLM API</text>
    <text x="410" y="96" text-anchor="middle" font-size="9" fill="#fbf9f3" opacity="0.9">OpenAI / Anthropic</text>
  </g>

  <g>
    <path d="M 700 50 Q 700 40 715 40 L 765 40 Q 780 40 780 50 L 780 100 Q 780 110 765 110 L 715 110 Q 700 110 700 100 Z" fill="#fbf9f3" stroke="#1a1714" stroke-width="1"/>
    <ellipse cx="740" cy="50" rx="40" ry="6" fill="#fbf9f3" stroke="#1a1714" stroke-width="1"/>
    <text x="740" y="85" text-anchor="middle" font-size="11" fill="#1a1714" font-weight="700">DATABASE</text>
  </g>

  <!-- User Input label -->
  <text x="20" y="200" font-size="10" fill="#8a8278" letter-spacing="1">USER INPUT</text>
  <line x1="20" y1="208" x2="100" y2="208" stroke="#1a1714" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 01: Process Input -->
  <g>
    <circle cx="125" cy="208" r="28" fill="#fbf9f3" stroke="#1a1714" stroke-width="1.5"/>
    <text x="125" y="205" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-style="italic" font-size="14" fill="#1a1714" font-weight="500">fn</text>
    <text x="125" y="220" text-anchor="middle" font-size="8" fill="#b8442c">01</text>
    <text x="125" y="257" text-anchor="middle" font-size="9" fill="#4a443d">Process Input</text>
  </g>

  <line x1="153" y1="208" x2="195" y2="208" stroke="#1a1714" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 02: Prompt Template -->
  <g>
    <rect x="195" y="183" width="100" height="50" rx="2" fill="#e8a896" stroke="#b8442c" stroke-width="1.5"/>
    <text x="245" y="205" text-anchor="middle" font-size="10" fill="#1a1714" font-weight="600">Prompt</text>
    <text x="245" y="220" text-anchor="middle" font-size="10" fill="#1a1714" font-weight="600">Template</text>
    <text x="245" y="257" text-anchor="middle" font-size="9" fill="#4a443d">+ RAG Context</text>
  </g>

  <line x1="295" y1="208" x2="345" y2="208" stroke="#1a1714" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 03: API Handler -->
  <g>
    <circle cx="370" cy="208" r="28" fill="#fbf9f3" stroke="#1a1714" stroke-width="1.5"/>
    <text x="370" y="205" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-style="italic" font-size="14" fill="#1a1714" font-weight="500">fn</text>
    <text x="370" y="220" text-anchor="middle" font-size="8" fill="#b8442c">02</text>
    <text x="370" y="257" text-anchor="middle" font-size="9" fill="#4a443d">API Handler</text>
  </g>

  <!-- Arrow up to LLM API -->
  <line x1="395" y1="190" x2="395" y2="115" stroke="#b8442c" stroke-width="1.5" marker-end="url(#arrow-accent)" stroke-dasharray="4,3"/>
  <text x="402" y="155" font-size="9" fill="#b8442c">POST</text>

  <!-- Arrow down from LLM API -->
  <line x1="425" y1="115" x2="425" y2="190" stroke="#1a1714" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="432" y="155" font-size="9" fill="#4a443d">Response</text>

  <line x1="398" y1="208" x2="465" y2="208" stroke="#1a1714" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 04: Parse SQL -->
  <g>
    <circle cx="490" cy="208" r="28" fill="#fbf9f3" stroke="#1a1714" stroke-width="1.5"/>
    <text x="490" y="205" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-style="italic" font-size="14" fill="#1a1714" font-weight="500">fn</text>
    <text x="490" y="220" text-anchor="middle" font-size="8" fill="#b8442c">03</text>
    <text x="490" y="257" text-anchor="middle" font-size="9" fill="#4a443d">Parse SQL</text>
  </g>

  <line x1="518" y1="208" x2="585" y2="208" stroke="#1a1714" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="200" font-size="8" fill="#8a8278">SELECT...</text>

  <!-- Stage 05: DB Handler -->
  <g>
    <circle cx="610" cy="208" r="28" fill="#fbf9f3" stroke="#1a1714" stroke-width="1.5"/>
    <text x="610" y="205" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-style="italic" font-size="14" fill="#1a1714" font-weight="500">fn</text>
    <text x="610" y="220" text-anchor="middle" font-size="8" fill="#b8442c">04</text>
    <text x="610" y="257" text-anchor="middle" font-size="9" fill="#4a443d">DB Handler</text>
  </g>

  <!-- Arrow up to Database -->
  <line x1="635" y1="190" x2="720" y2="115" stroke="#b8442c" stroke-width="1.5" marker-end="url(#arrow-accent)" stroke-dasharray="4,3"/>
  <text x="660" y="160" font-size="9" fill="#b8442c">QUERY</text>

  <!-- Output: Table -->
  <line x1="638" y1="208" x2="780" y2="208" stroke="#1a1714" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="780" y="185" width="90" height="46" fill="#fbf9f3" stroke="#1a1714" stroke-width="1"/>
    <line x1="780" y1="200" x2="870" y2="200" stroke="#1a1714" stroke-width="0.5"/>
    <line x1="780" y1="215" x2="870" y2="215" stroke="#1a1714" stroke-width="0.5"/>
    <line x1="810" y1="185" x2="810" y2="231" stroke="#1a1714" stroke-width="0.5"/>
    <line x1="840" y1="185" x2="840" y2="231" stroke="#1a1714" stroke-width="0.5"/>
    <text x="825" y="250" text-anchor="middle" font-size="9" fill="#4a443d">Result Table</text>
  </g>

  <!-- Bottom label -->
  <text x="450" y="315" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-style="italic" font-size="13" fill="#8a8278">Five-stage pipeline · Natural language in, structured data out</text>
</svg>
